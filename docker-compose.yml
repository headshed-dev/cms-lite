services:
  laravel-docker:
    container_name: laravel-cms-lite
    build: .
    volumes:
      - ./laravel-app:/var/www/html
      - ./php.ini:/usr/local/etc/php/php.ini
    # ports:
    #   - 9002:9002
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.http.routers.sha01.rule: "Host(`sha01.headshed.dev`)"
      traefik.http.routers.sha01.entrypoints: "web,websecure"
      traefik.http.routers.sha01.tls.certresolver: "le"
      traefik.http.services.sha01.loadbalancer.server.port: "9002"
      traefik.docker.network: "traefik-net"
    networks:
      - traefik-net
  queue-worker:
    build: .
    command: php artisan queue:work --queue=export_blog_articles,default -v
    #command: sleep infinity
    volumes:
      - ./laravel-app:/var/www/html
    depends_on:
      - laravel-docker
    restart: unless-stopped
    networks:
      - traefik-net
networks:
  traefik-net:
    external: true
